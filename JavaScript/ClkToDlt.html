<html>
    <head>
        <title>Click to Remove</title>
    </head>
    <body>
        <h1 id="no1" onclick="fun(event)">One</h1>
        <h1 id="no2" onclick="fun(event)">Two</h1>
        <h1 id="no3" onclick="fun(event)">Three</h1>
        <h1 id="no4" onclick="fun(event)">Four</h1>
        <h1 id="no5" onclick="fun(event)">Five</h1>
        <h1 id="no6" onclick="fun(event)">six</h1>
    </body>
    <style>
        
    </style>
    <script>
      
        function fun(event){ 
          event.target.remove()
        }
    </script>
</html>
